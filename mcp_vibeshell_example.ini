[vibeshell]
; Long random token used by MCP / tools as Bearer token
token = ABC123

; Primary directory for file operations and root directory for this shell.
; "~" means "this OS user's home directory" (e.g. /home/username).
; File operations also allow ~/logs when this points to a narrower directory.
base_dir = ~

; Remote commands run as the PHP worker's OS user. Enable only with HTTPS and
; a strong non-empty token.
shell_enabled = false
shell_max_timeout = 120
shell_max_output_bytes = 1048576
shell_max_stdin_bytes = 1048576
